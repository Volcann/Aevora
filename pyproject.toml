[project]
name = "volcani"
version = "0.1.0"
description = "Django MCP Hub — Gemini AI + local MCP tools"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "whitenoise>=6.7",
    "channels>=4.2",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "psycopg[binary]>=3.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-yasg>=1.21.7",
    "google-generativeai>=0.8",
    "mcp>=1.3",
    "celery>=5.4",
    "redis>=5.2",
    "django-constance[database]>=3.1",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "django-celery-beat>=2.9.0",
    "django-storages>=1.14.6",
    "flower>=2.0.1",
    "boto3>=1.43.56",
    "django-silk>=5.5.0",
    "dj-database-url>=3.1.2",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = [
    "django-silk>=5.4.3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.14.10",
    "pytest-asyncio==1.3.*",
    "pytest-cov==4.1.0",
    "pytest-html==4.1.1",
    "moto[s3]>=5.1.21",
]
