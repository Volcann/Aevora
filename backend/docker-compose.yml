name: aevora

x-common: &common
  stdin_open: true
  tty: true
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6382
    - REDIS_URL=redis://redis:6382/0
    - CELERY_BROKER_URL=redis://redis:6382/0
    - CELERY_RESULT_BACKEND=redis://redis:6382/0

x-django-build: &django-build
  build:
    context: .
    args:
      DJANGO_ENV: ${DJANGO_ENV:-dev}
  volumes:
    - .:/app
    - aevora_static_volume:/app/staticfiles
    - aevora_media_volume:/app/media

services:
  postgres:
    image: postgres:17-alpine
    container_name: aevora_postgres
    command: postgres -p 5434
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: 5434
    volumes:
      - aevora_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5434"
    <<: *common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5434"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  django:
    <<: [*django-build, *common]
    container_name: aevora_django
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8002 --reload --reload-dir /app
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health/')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery:
    <<: [*django-build, *common]
    container_name: aevora_celery
    command: bash -c "celery -A aevora worker -l info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    <<: [*django-build, *common]
    container_name: aevora_celery_beat
    command: bash -c "celery -A aevora beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    <<: [*django-build, *common]
    container_name: aevora_flower
    command: bash -c "celery -A aevora flower --conf=config/settings/flower.py"
    ports:
      - "127.0.0.1:5557:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/flower/healthcheck')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aevora_redis
    command: redis-server --port 6382
    ports:
      - "127.0.0.1:6382:6382"
    volumes:
      - aevora_redis_data:/data
    <<: *common
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  aevora_static_volume:
    name: aevora_static_volume
  aevora_media_volume:
    name: aevora_media_volume
  aevora_redis_data:
    name: aevora_redis_data
  aevora_postgres_data:
    name: aevora_postgres_data
