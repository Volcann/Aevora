<div class="dialogue">
  <div class="dialogue-inner">
    <div class="greeting-label" id="volcanrisStatusLabel">
      Online · Ready
    </div>

    <!-- Session Header -->
    <div class="session-header">
      <div class="session-selector">
        <select
          class="session-select"
          id="sessionSelect"
          title="Switch session"
        >
          {% for s in recent_sessions %}
          <option
            value="{{ s.id }}"
            {% if s.id == session.id %}selected{% endif %}
          >
            {{ s.title|default:"New Chat" }}
          </option>
          {% endfor %}
        </select>
      </div>
      <a
        href="{% url 'ai_chat:ai_chat' %}"
        class="new-session-btn"
        title="Start new session"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        New
      </a>
    </div>

    <!-- Real-time chat log -->
    <div class="volcanris-chat-log" id="volcanrisChatLog">
      {% for msg in chat_messages %}
      {% if msg.role == "user" or msg.role == "human" %}
      <div class="msg-bubble msg-user">
        <div class="msg-user-author">YOU</div>
        <div class="msg-text">{{ msg.content }}</div>
      </div>
      {% else %}
      <div class="msg-bubble msg-volcanris">
        <div class="msg-volcanris-author">
          <svg
            width="8"
            height="8"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          VOLCANRIS
        </div>
        <div class="msg-text">{{ msg.content }}</div>
      </div>
      {% endif %}
      {% empty %}
      <div class="msg-bubble msg-volcanris">
        <div class="msg-volcanris-author">
          <svg
            width="8"
            height="8"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          VOLCANRIS
        </div>
        <div class="msg-text">Hi Volcani, how can I help you?</div>
      </div>
      {% endfor %}
      <!-- Thinking bubble injected by JS -->
      <div class="thinking-bubble" id="volcanrisThinking">
        <div class="thinking-label">Processing</div>
        <div class="thinking-dots">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
      </div>
    </div>

    <!-- Tap-to-talk hint -->
    <div
      id="tapHint"
      style="
        font-family: 'Orbitron', monospace;
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 6px;
        opacity: 0.8;
      "
    >
      ▲ Tap the orb to speak
    </div>

    <!-- Hidden CSRF for AJAX -->
    {% csrf_token %}
    <span id="streamingStatus" style="display: none"></span>
  </div>
  <div class="wave" id="volcanrisWave">
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
    <div class="wb"></div>
  </div>
</div>
