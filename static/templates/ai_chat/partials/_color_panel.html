<div class="color-panel" id="colorPanel">
  <div class="color-sliders-card" id="colorCard">
    <div class="slider-card-header">
      <span class="slider-card-title">Accent Color</span>
      <div class="color-swatch" id="colorSwatch"></div>
    </div>
    <div class="slider-row">
      <div class="slider-labels">
        <span class="slider-label">Hue</span>
        <span class="slider-val" id="valHue">138°</span>
      </div>
      <input
        type="range"
        id="sliderHue"
        min="0"
        max="360"
        value="138"
        step="1"
      />
    </div>
    <div class="slider-row">
      <div class="slider-labels">
        <span class="slider-label">Saturation</span>
        <span class="slider-val" id="valSat">55%</span>
      </div>
      <input
        type="range"
        id="sliderSat"
        min="10"
        max="100"
        value="55"
        step="1"
      />
    </div>
    <div class="slider-row">
      <div class="slider-labels">
        <span class="slider-label">Lightness</span>
        <span class="slider-val" id="valLit">42%</span>
      </div>
      <input
        type="range"
        id="sliderLit"
        min="20"
        max="70"
        value="42"
        step="1"
      />
    </div>
    <div>
      <div class="slider-labels" style="margin-bottom: 6px">
        <span
          class="slider-label"
          style="
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
          "
        >Presets</span
        >
      </div>
      <div class="preset-row" id="presetRow"></div>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 8px">
      <button class="btn-save-default" id="btnSaveDefault">
        Set as Default
      </button>
      <button class="btn-reset-color" id="btnResetColor">Reset</button>
    </div>
  </div>
  <button
    class="color-panel-trigger"
    id="colorPanelTrigger"
    title="Customize accent color"
    aria-label="Open color customizer"
    aria-expanded="false"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="white"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="3" />
      <path
        d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"
      />
    </svg>
  </button>
</div>
