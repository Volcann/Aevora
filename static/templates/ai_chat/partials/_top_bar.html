{% load static %}
<div class="top-bar">
  <div class="top-sep"></div>
  <div class="top-title">VOLCANRIS</div>
  <div class="top-sep"></div>
  <div class="top-version">v4.1.2</div>
  <div
    class="hud-user-chip"
    id="openProfileBtnVolcanris"
    title="User Profile"
  >
    <img
      src="https://avatars.githubusercontent.com/u/142692213?v=4"
      alt="GitHub Profile"
      class="hud-avatar"
    />
    <span class="hud-username"
      >{{ request.user.username|default:"Operator" }}</span
    >
  </div>
  <a
    href="{% url 'ai_chat:ai_chat' %}"
    class="chat-nav-btn"
    title="Navigate to AI Chat Interface"
  >
    <svg
      width="12"
      height="12"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path
        d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
      />
    </svg>
    Chat
  </a>
  <form
    method="POST"
    action="{% url 'accounts:logout' %}"
    style="margin: 0; display: inline-flex"
  >
    {% csrf_token %}
    <button type="submit" class="logout-nav-btn" title="Logout">
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Logout
    </button>
  </form>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="toggle-thumb">
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </span>
  </button>
</div>
