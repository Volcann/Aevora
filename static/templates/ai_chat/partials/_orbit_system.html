<div class="orbit-system" id="orbitSystem">
  <div class="sphere-halo"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-1"></div>
  <!-- Thinking rings — shown while VOLCANRIS processes -->
  <div class="sphere-thinking-ring" id="sphereThinkRing1"></div>
  <div class="sphere-thinking-ring-2" id="sphereThinkRing2"></div>
  <!-- Listening rings, radar sweep & pulse waves — active while listening to the user -->
  <div class="sphere-reticle-ring" id="sphereReticle"></div>
  <div class="sphere-listening-radar" id="sphereListenRadar"></div>
  <div class="sphere-listening-pulse" id="sphereListenPulse"></div>
  <div class="sphere-listening-pulse-2" id="sphereListenPulse2"></div>
  <div class="sphere-listening-ring" id="sphereListenRing1"></div>
  <div class="sphere-listening-ring-2" id="sphereListenRing2"></div>
  <div class="sphere-wrap" id="sphereWrap">
    <canvas id="sphereCanvas" width="300" height="300"></canvas>
    <div class="sphere-sheen"></div>
    <div class="sphere-reflection"></div>
    <div class="sphere-edge"></div>
  </div>
</div>
