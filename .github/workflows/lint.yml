name: Lint

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ruff Lint Check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: 'format --check'
